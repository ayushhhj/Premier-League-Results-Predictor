# Daily: refresh data, predict (the day before a gameweek starts), score, rebuild
# the page, commit the data and publish to GitHub Pages.
#
# Setup: add a FOOTBALL_API_KEY repository secret, and set Pages' source to
# "GitHub Actions".

name: Predict and publish

on:
  schedule:
    - cron: "17 9 * * *"   # daily, 09:17 UTC
  workflow_dispatch:        # manual runs from the Actions tab

# one run at a time, since each one commits and pushes
concurrency:
  group: predict
  cancel-in-progress: false

permissions:
  contents: write   # commit data back to the repo
  pages: write
  id-token: write   # required by deploy-pages

jobs:
  predict:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: src
    env:
      FOOTBALL_API_KEY: ${{ secrets.FOOTBALL_API_KEY }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # 3.12+ needed
          cache: pip

      - name: Install dependencies
        run: pip install -r ../requirements.txt

      # ~59 API calls a day: standings, 38 fixture weeks, ~20 teams
      - name: Refresh fixtures and results
        run: python data_fetch.py

      - name: Refresh team matches (rest days)
        run: python -c "from data_fetch import get_all_team_matches; get_all_team_matches(['2026/2027'])"

      # no-op unless the next gameweek starts tomorrow
      - name: Predict next gameweek
        run: python predict.py --if-starts-tomorrow

      - name: Score predictions against results
        run: python score_results.py

      - name: Build the page
        run: python build_site.py

      - name: Commit refreshed data and predictions
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Daily update: data, predictions and results ($(date -u +%F))"
            git push
          fi

      - name: Upload the page
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
